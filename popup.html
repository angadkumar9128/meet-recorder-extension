<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 280px; margin: 0; padding: 14px; font: 14px system-ui, sans-serif; color: #202124; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  #status { margin-bottom: 10px; font-weight: 600; }
  #status.rec { color: #d93025; }
  label { display: block; font-size: 12px; color: #5f6368; margin-bottom: 4px; }
  input { width: 100%; box-sizing: border-box; padding: 7px; margin-bottom: 10px; border: 1px solid #dadce0; border-radius: 6px; }
  button { width: 100%; padding: 9px; border: 0; border-radius: 6px; font-size: 14px; cursor: pointer; margin-bottom: 6px; }
  #start { background: #1a73e8; color: #fff; }
  #stop { background: #d93025; color: #fff; }
  button:disabled { opacity: .4; cursor: default; }
  #msg { font-size: 12px; color: #5f6368; min-height: 16px; }
  #mic { display: none; font-size: 12px; background: #fef7e0; padding: 8px; border-radius: 6px; margin-bottom: 8px; }
  #mic a { color: #1a73e8; cursor: pointer; }
</style>
</head>
<body>
  <h1>Meet Recorder</h1>
  <div id="status">Idle</div>
  <div id="mic">Microphone access needed so your own voice is recorded. <a id="micLink">Grant access</a></div>
  <label for="name">Your name (replaces "You" in transcript)</label>
  <input id="name" placeholder="e.g. Angad Kumar">
  <button id="start">Start recording</button>
  <button id="stop" disabled>Stop &amp; download</button>
  <button id="diag" style="background:#f1f3f4;font-size:12px">Copy caption diagnostics</button>
  <div id="msg"></div>
  <script src="popup.js"></script>
</body>
</html>
